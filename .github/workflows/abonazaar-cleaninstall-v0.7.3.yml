name: Build + launch-test Abonazaar v0.7.3 CLEAN INSTALL APK

on:
  push:
    branches: [release/native-v0.7.3-cleaninstall]

jobs:
  android-clean:
    name: Android build + real launch smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact BonBazaar source
        run: |
          cat build-source/part1.b64 build-source/part2.b64 build-source/part3.b64 build-source/part4a.b64 build-source/part4b.b64 build-source/part4c.b64 | base64 -d > source.zip
          echo '150f3601e9e72bf4783a96a77aa08ae423375d42f8fd89330aa88dc460c89542  source.zip' | sha256sum -c -
          unzip -q source.zip -d src
          ROOT="$(dirname "$(find "$GITHUB_WORKSPACE/src" -name package.json | head -n1)")"
          test -n "$ROOT"
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Android SDK 36
        run: yes | sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_ROOT }}
        run: npm install --no-audit --no-fund

      - name: Run project tests
        working-directory: ${{ env.PROJECT_ROOT }}
        run: npm test

      - name: Set conflict-free Android identity
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('capacitor.config.json')
          d=json.loads(p.read_text())
          d['appId']='com.bonbazaar.abonazaar.release073'
          d['appName']='Abonazaar'
          p.write_text(json.dumps(d, indent=2) + '\n')
          print('appId=', d['appId'])
          PY
          grep -F 'com.bonbazaar.abonazaar.release073' capacitor.config.json

      - name: Generate and sync Android
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          npx cap add android
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/variables.gradle')
          s=p.read_text()
          s=re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36', s)
          s=re.sub(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 36', s)
          p.write_text(s)
          PY
          npx cap sync android

      - name: Verify generated package identity
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          grep -R -F 'com.bonbazaar.abonazaar.release073' android/app/build.gradle android/app/src/main 2>/dev/null
          if grep -R -F 'applicationId "com.bonbazaar.abonazaar"' android/app/build.gradle; then
            echo 'Old conflicting applicationId still present' >&2
            exit 1
          fi

      - name: Build native APK
        working-directory: ${{ env.PROJECT_ROOT }}/android
        run: chmod +x gradlew && ./gradlew clean assembleDebug

      - name: Stage APK before device test
        run: |
          mkdir -p out/android
          APK="$PROJECT_ROOT/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" out/android/Abonazaar-v0.7.3-CLEAN-INSTALL.apk
          sha256sum out/android/Abonazaar-v0.7.3-CLEAN-INSTALL.apk > out/android/SHA256.txt
          cat out/android/SHA256.txt

      - name: Android 16 emulator install + launch + crash check
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            set -euxo pipefail
            PKG='com.bonbazaar.abonazaar.release073'
            APK="$GITHUB_WORKSPACE/out/android/Abonazaar-v0.7.3-CLEAN-INSTALL.apk"
            adb install "$APK"
            adb shell pm list packages | grep -F "package:$PKG"
            adb logcat -c
            adb shell am force-stop "$PKG"
            adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1
            sleep 8
            PID="$(adb shell pidof "$PKG" | tr -d '\r' || true)"
            echo "PID=$PID"
            test -n "$PID"
            adb shell dumpsys activity activities > "$GITHUB_WORKSPACE/out/android/dumpsys-activity.txt"
            adb logcat -d > "$GITHUB_WORKSPACE/out/android/launch-logcat.txt"
            if grep -E "FATAL EXCEPTION|Process: $PKG.*has died|Force finishing activity.*$PKG" "$GITHUB_WORKSPACE/out/android/launch-logcat.txt"; then
              echo 'Launch crash detected' >&2
              exit 1
            fi
            adb shell uiautomator dump /sdcard/window.xml || true
            adb pull /sdcard/window.xml "$GITHUB_WORKSPACE/out/android/window.xml" || true
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/out/android/launch-screen.png"
            test -s "$GITHUB_WORKSPACE/out/android/launch-screen.png"
            echo 'REAL_LAUNCH_SMOKE_TEST=PASS'

      - name: Final green gate
        run: |
          test -s out/android/Abonazaar-v0.7.3-CLEAN-INSTALL.apk
          test -s out/android/SHA256.txt
          test -s out/android/launch-logcat.txt
          test -s out/android/launch-screen.png
          printf '%s\n' \
            'BUILD=PASS' \
            'PACKAGE_ID=com.bonbazaar.abonazaar.release073' \
            'ANDROID_16_INSTALL=PASS' \
            'ANDROID_16_LAUNCH=PASS' \
            'CRASH_CHECK=PASS' > out/android/FINAL-GREEN-GATE.txt
          cat out/android/FINAL-GREEN-GATE.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Abonazaar-v0.7.3-LAUNCH-TESTED
          path: |
            out/android/Abonazaar-v0.7.3-CLEAN-INSTALL.apk
            out/android/SHA256.txt
            out/android/FINAL-GREEN-GATE.txt
            out/android/launch-logcat.txt
            out/android/dumpsys-activity.txt
            out/android/window.xml
            out/android/launch-screen.png
          if-no-files-found: error
